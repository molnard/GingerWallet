name: Build and upload release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, for example v2.0.25.0'
        required: true
        type: string
      code_sign:
        description: 'Code sign Windows and macOS packages'
        required: true
        default: false
        type: boolean
      release_sign:
        description: 'Create PGP signatures and SHA256SUMS.gingersig'
        required: true
        default: false
        type: boolean
      create_release:
        description: 'Create a draft GitHub release from the generated packages'
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  CODE_SIGN: ${{ github.event_name == 'push' || inputs.code_sign }}
  RELEASE_SIGN: ${{ github.event_name == 'push' || inputs.release_sign }}
  CREATE_RELEASE: ${{ github.event_name == 'push' || inputs.create_release }}

jobs:
  debian-package-and-zips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Debian package and Linux zips
        run: bash ./Contrib/release.sh debian

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: packages-for-debian
          path: ./packages/*.deb
          compression-level: 0
          if-no-files-found: error

      - name: Upload Linux zip and tar package
        uses: actions/upload-artifact@v4
        with:
          name: packages-zip-tar
          path: |
            ./packages/*
            !./packages/*.deb
          compression-level: 0
          if-no-files-found: error

  appimage-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build AppImage
        run: bash ./Contrib/release.sh appimage

      - name: Upload AppImage package
        uses: actions/upload-artifact@v4
        with:
          name: packages-appimage
          path: ./packages/*.AppImage
          compression-level: 0
          if-no-files-found: error

  installer-for-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install WiX Toolset and 7-Zip
        run: |
          choco install wixtoolset --version=3.14.1 --force
          choco install 7zip.commandline --force

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Build Windows installer
        shell: bash
        env:
          CODE_SIGN: ${{ env.CODE_SIGN }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CERTIFICATE_NAME: ${{ secrets.AZURE_CERTIFICATE_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: bash ./Contrib/release.sh wininstaller

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-for-windows
          path: ./packages/*
          compression-level: 0
          if-no-files-found: error

  macos-packages-and-zips:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build signed DMGs and macOS zips
        shell: bash
        env:
          CODE_SIGN: ${{ env.CODE_SIGN }}
          MAC_CER: ${{ secrets.MAC_CER }}
          MAC_P12: ${{ secrets.MAC_P12 }}
          MAC_TEAMID: ${{ secrets.MAC_TEAMID }}
          MAC_APPLEID: ${{ secrets.MAC_APPLEID }}
          MAC_APPLEPSSWD: ${{ secrets.MAC_APPLEPSSWD }}
          MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
        run: bash ./Contrib/release.sh dmg

      - name: Upload macOS zip and DMG packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-zip-dmg
          path: ./packages/*
          compression-level: 0
          if-no-files-found: error

  sign-all-packages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - debian-package-and-zips
      - appimage-package
      - installer-for-windows
      - macos-packages-and-zips

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          name: packages-for-debian
          path: ./packages

      - name: Download Linux compressed packages
        uses: actions/download-artifact@v4
        with:
          name: packages-zip-tar
          path: ./packages

      - name: Download AppImage packages
        uses: actions/download-artifact@v4
        with:
          name: packages-appimage
          path: ./packages

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: packages-for-windows
          path: ./packages

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: packages-zip-dmg
          path: ./packages

      - name: Import GPG key
        if: env.RELEASE_SIGN == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.SIGNING_PGP_KEY }}
          passphrase: ${{ secrets.SIGNING_PGP_PASSPHRASE }}

      - name: PGP and Ginger signing
        if: env.RELEASE_SIGN == 'true'
        shell: bash
        env:
          SIGNING_GINGER_KEY: ${{ secrets.SIGNING_GINGER_KEY }}
        run: bash ./Contrib/release.sh gpgsign

      - name: Create unsigned checksums
        if: env.RELEASE_SIGN != 'true'
        shell: bash
        run: bash ./Contrib/release.sh checksums

      - name: Create release note
        shell: bash
        run: bash ./Contrib/release.sh releasenote > ReleaseNote.md

      - name: Create draft GitHub release
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Ginger Wallet ${{ env.RELEASE_TAG }}
          files: ./packages/*
          body_path: ReleaseNote.md
          generate_release_notes: true
          draft: true
